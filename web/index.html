<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101214">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Local-first dashboard for the Elegoo Centauri Carbon.">
  <title>Elegoo Connector</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <div id="banner" class="banner" role="status" aria-live="polite" hidden>
    <span class="banner-dot" aria-hidden="true"></span>
    <span id="banner-text"></span>
  </div>

  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M4 8.5 12 4l8 4.5v7L12 20l-8-4.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M4 8.5 12 13l8-4.5M12 13v7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name">Elegoo Connector</span>
    </div>
    <div class="topbar-state" id="topbar-state">
      <span class="conn-chip" data-conn="connecting">
        <span class="conn-dot" aria-hidden="true"></span>
        <span id="topbar-conn-text">Connecting</span>
      </span>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Sections">
    <a href="#/now" data-view="now" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 8v4.5l3 1.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>Now</span>
    </a>
    <a href="#/control" data-view="control">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 7h14M5 12h14M5 17h14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="9" cy="7" r="2" fill="currentColor"/><circle cx="15" cy="12" r="2" fill="currentColor"/><circle cx="10" cy="17" r="2" fill="currentColor"/></svg>
      <span>Control</span>
    </a>
    <a href="#/files" data-view="files">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7.5A1.5 1.5 0 0 1 5.5 6h4l2 2.5h7A1.5 1.5 0 0 1 20 10v8a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>Files</span>
    </a>
    <a href="#/history" data-view="history">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 7.5V12l-2.5 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>History</span>
    </a>
    <a href="#/about" data-view="about">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 11v5.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="8" r="1.1" fill="currentColor"/></svg>
      <span>About</span>
    </a>
  </nav>

  <main id="view" tabindex="-1"></main>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <noscript>
    <p class="card">This dashboard needs JavaScript to talk to the printer bridge.</p>
  </noscript>

  <script type="module" src="./app.js"></script>
</body>
</html>
